[package]
name        = "marbles"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.88"
license     = "MIT"
description = "A small, single-writer issue tracker for fleets of coding agents — the interface of Beads, without Dolt."
repository  = "https://github.com/FuturePresentLabs/marbles"

[features]
default = []
soil = ["dep:soil-sdk-records", "dep:soil-sdk-unibus"]

[dependencies]
chrono      = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
getrandom   = "0.3"
# Plan specs are TOML or JSON; the parser is portable, and the wasm Spore
# parses the same spec the native CLI does.
toml        = "0.9"
soil-sdk-records = { git = "https://github.com/mycelium-linux/soil.git", rev = "fc010d45218826b6cf980a352b526c48e0691d45", optional = true }
# Publishing after the write is the Spore's job, not the records host's: the
# host links both interfaces, and the command composes them.
soil-sdk-unibus = { git = "https://github.com/mycelium-linux/soil.git", rev = "fc010d45218826b6cf980a352b526c48e0691d45", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64      = "0.22"
clap        = { version = "4.6", features = ["derive", "env"] }
dirs        = "6"
openssl     = { version = "0.10", features = ["vendored"] }
rusqlite    = { version = "0.37", features = ["bundled", "functions"] }
sha2        = "0.10"

[[bin]]
name = "mb"
path = "src/bin/mb.rs"
required-features = ["soil"]

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
