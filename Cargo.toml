[package]
name        = "marbles"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.88"
license     = "MIT"
description = "A small, single-writer issue tracker for fleets of coding agents — the interface of Beads, without Dolt."
repository  = "https://github.com/FuturePresentLabs/marbles"

[dependencies]
axum        = "0.8"
chrono      = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap        = { version = "4.6", features = ["derive", "env"] }
dirs        = "6"
getrandom   = "0.3"
jsonwebtoken = "10"
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite    = { version = "0.37", features = ["bundled", "functions"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
thiserror   = "2"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
toml        = "0.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
