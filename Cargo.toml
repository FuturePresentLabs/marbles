[package]
name        = "marbles"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.88"
license     = "MIT"
description = "A small, single-writer issue tracker for fleets of coding agents — the interface of Beads, without Dolt."
repository  = "https://github.com/FuturePresentLabs/marbles"

[features]
default = ["native"]
native = []
soil = ["dep:soil-sdk-records"]

[dependencies]
chrono      = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
getrandom   = "0.3"
soil-sdk-records = { git = "https://github.com/fungOS-linux/soil.git", rev = "a5b7721abf48739b18cee3e9292bdbfeb9940915", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum        = "0.8"
base64      = "0.22"
clap        = { version = "4.6", features = ["derive", "env"] }
dirs        = "6"
fs2         = "0.4"
hmac        = "0.12"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
openssl      = { version = "0.10", features = ["vendored"] }
postgres     = "0.19"
postgres-openssl = "0.5"
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite    = { version = "0.37", features = ["bundled", "functions"] }
sha2        = "0.10"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal"] }
toml        = "0.9"
wasmtime    = { version = "34", default-features = false, features = ["cranelift", "runtime", "std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
