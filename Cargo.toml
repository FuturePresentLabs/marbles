[package]
name        = "marbles"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.88"
license     = "MIT"
description = "A small, single-writer issue tracker for fleets of coding agents — the interface of Beads, without Dolt."
repository  = "https://github.com/FuturePresentLabs/marbles"

[features]
default = ["native"]
native = []
soil = ["dep:soil-sdk-records", "dep:soil-sdk-unibus"]

[dependencies]
chrono      = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
getrandom   = "0.3"
soil-sdk-records = { git = "https://github.com/mycelium-linux/soil.git", rev = "bc1495575b6b78dfdef337f5bc42e5d141ab2190", optional = true }
# Publishing after the write is the Spore's job, not the records host's: the
# host links both interfaces, and the command composes them.
soil-sdk-unibus = { git = "https://github.com/mycelium-linux/soil.git", rev = "bc1495575b6b78dfdef337f5bc42e5d141ab2190", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum        = "0.8"
base64      = "0.22"
clap        = { version = "4.6", features = ["derive", "env"] }
dirs        = "6"
fs2         = "0.4"
hmac        = "0.12"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
openssl      = { version = "0.10", features = ["vendored"] }
postgres     = "0.19"
postgres-openssl = "0.5"
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite    = { version = "0.37", features = ["bundled", "functions"] }
sha2        = "0.10"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal"] }
toml        = "0.9"
wasmtime    = { version = "34", default-features = false, features = ["cranelift", "runtime", "std"] }
# The mesh client: framing, registration, and the envelope type. Marbles publishes
# as a producer, so it needs the hub's wire protocol and nothing else from Unibus.
unibus      = { git = "https://github.com/mycelium-linux/unibus", rev = "727fce91a4612a30eb1cf3acd802da6633619cc3" }

[[bin]]
name = "mb"
path = "src/bin/mb.rs"
required-features = ["soil"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
