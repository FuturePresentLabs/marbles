list = "0.0.0.0:7878"
company_store_root = "/data/companies"

[auth]
oidc_issuer = "https://sso.fpl.dev"
oidc_audience = "marbles"
company_claim = "company_id"
agent_client_ids = []

# The event sink. One at a time: an outbox row holds a single delivery state, so
# `[server.webhook]` and `[server.unibus]` are alternatives — configuring both is
# a startup error, not a chain.
#
# [server.unibus]
# hub_endpoint = "127.0.0.1:18790"
# token_file = "/run/secrets/unibus-marbles.token"
# installation_id = "fpl-cloud"   # default
# producer_id = "marbles"         # default: must match the hub's node entry
# zones = ["agents"]              # default
