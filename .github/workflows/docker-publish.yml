name: Docker Publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Dry-run hook: dispatch the build from any branch to prove the credentials work without
  # creating a tag or publishing an image (the push steps are gated on `inputs.push`).
  workflow_dispatch:
    inputs:
      push:
        description: "Push the built image to the registry"
        type: boolean
        default: false
env:
  FPL_REGISTRY_DIRECT_HOST: ${{ vars.FPL_REGISTRY_DIRECT_HOST || 'registry-direct.fpl.dev' }}
  # Pull-side host for the Bob image: `registry.fpl.dev` is Cloudflare-proxied and answers
  # `401 Basic realm="Restricted"` outside the mesh, while the installed client certs are
  # scoped to the direct host.
  FPL_REGISTRY_PULL_HOST: ${{ vars.FPL_REGISTRY_PULL_HOST || 'registry-direct.fpl.dev' }}
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install registry client certs
        env:
          FPL_REGISTRY_CA_CERT: ${{ secrets.FPL_REGISTRY_CA_CERT }}
          FPL_REGISTRY_CLIENT_CERT: ${{ secrets.FPL_REGISTRY_CLIENT_CERT }}
          FPL_REGISTRY_CLIENT_KEY: ${{ secrets.FPL_REGISTRY_CLIENT_KEY }}
        run: .github/scripts/install-fpl-registry-certs.sh
      - name: Resolve the Bob image onto the mTLS registry host
        run: |
          # The Dockerfile owns the digest; only the host is rewritten, because Docker's
          # /etc/docker/certs.d trust (and therefore the client cert) is per host.
          bob="$(sed -n 's/^ARG BOB_IMAGE=//p' Dockerfile)"
          test -n "${bob}" || { echo "::error::Dockerfile has no BOB_IMAGE ARG"; exit 1; }
          echo "BOB_IMAGE=${bob/registry.fpl.dev/${FPL_REGISTRY_PULL_HOST}}" >>"${GITHUB_ENV}"
      - name: Build immutable Marbles image
        env:
          # Optional remote-cache opt-in. All four must be configured; otherwise the
          # Dockerfile builds with sccache disabled and no credentials are passed. The
          # cache is DigitalOcean/mycelium S3, not AWS/R2.
          SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          SCCACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          SCCACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
        run: |
          image="${FPL_REGISTRY_DIRECT_HOST}/marbles"
          cache_args=()
          if [ -n "${SCCACHE_ENDPOINT}" ] && [ -n "${SCCACHE_BUCKET}" ] \
             && [ -n "${SCCACHE_ACCESS_KEY_ID}" ] && [ -n "${SCCACHE_SECRET_ACCESS_KEY}" ]; then
            (umask 077
             printf '%s' "${SCCACHE_ACCESS_KEY_ID}" >"${RUNNER_TEMP}/sccache-key-id"
             printf '%s' "${SCCACHE_SECRET_ACCESS_KEY}" >"${RUNNER_TEMP}/sccache-secret")
            cache_args=(
              --build-arg "SCCACHE_BUCKET=${SCCACHE_BUCKET}"
              --build-arg "SCCACHE_ENDPOINT=${SCCACHE_ENDPOINT}"
              --secret "id=sccache_access_key_id,src=${RUNNER_TEMP}/sccache-key-id"
              --secret "id=sccache_secret_access_key,src=${RUNNER_TEMP}/sccache-secret"
            )
          else
            echo "::notice title=sccache disabled::no SCCACHE_ENDPOINT/SCCACHE_BUCKET and cache key pair configured; building without a remote cache"
          fi
          docker build \
            --build-arg "BOB_IMAGE=${BOB_IMAGE}" \
            "${cache_args[@]}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${image}:latest" -t "${image}:sha-${GITHUB_SHA}" .
      - name: Push and verify the manifest
        if: github.event_name != 'workflow_dispatch' || inputs.push
        run: |
          image="${FPL_REGISTRY_DIRECT_HOST}/marbles"
          docker push "${image}:latest"
          docker push "${image}:sha-${GITHUB_SHA}"
          sudo docker manifest inspect "${image}:sha-${GITHUB_SHA}" >/dev/null
