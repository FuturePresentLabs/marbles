name: Docker Publish
on:
  push:
    branches: [main]
    tags: ["v*"]
env:
  FPL_REGISTRY_DIRECT_HOST: ${{ vars.FPL_REGISTRY_DIRECT_HOST || 'registry-direct.fpl.dev' }}
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install registry client certs
        env:
          FPL_REGISTRY_CA_CERT: ${{ secrets.FPL_REGISTRY_CA_CERT }}
          FPL_REGISTRY_CLIENT_CERT: ${{ secrets.FPL_REGISTRY_CLIENT_CERT }}
          FPL_REGISTRY_CLIENT_KEY: ${{ secrets.FPL_REGISTRY_CLIENT_KEY }}
        run: .github/scripts/install-fpl-registry-certs.sh
      - name: Build and push immutable Marbles image
        run: |
          image="${FPL_REGISTRY_DIRECT_HOST}/marbles"
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "${image}:latest" -t "${image}:sha-${GITHUB_SHA}" .
          docker push "${image}:latest"
          docker push "${image}:sha-${GITHUB_SHA}"
          docker manifest inspect "${image}:sha-${GITHUB_SHA}" >/dev/null
